version: 2

models:
  - name: fct_order_items
    description: Transaction fact at order-item grain.

    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

      - name: order_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: quantity
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"

      - name: line_revenue
        data_tests:
          - not_null

      - name: line_cost
        data_tests:
          - not_null

      - name: line_gross_profit
        data_tests:
          - not_null

      - name: has_promo
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

      - name: promo_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_promotions')
                field: promo_id

      - name: promo_id_2
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_promotions')
                field: promo_id

  - name: fct_daily_sales
    description: Daily revenue, cost and profitability fact.

    columns:
      - name: sales_date
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: revenue
        data_tests:
          - not_null

      - name: cogs
        data_tests:
          - not_null

      - name: gross_profit
        data_tests:
          - not_null

  - name: fct_orders
    description: Order-level transaction fact enriched with payment information.

    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: order_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: zip
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: zip

      - name: order_status
        data_tests:
          - not_null

      - name: payment_value
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: installments
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

  - name: fct_returns
    description: Product return fact at return_id grain.

    columns:
      - name: return_id
        data_tests:
          - not_null
          - unique

      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: return_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: return_quantity
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"

      - name: refund_amount
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

  - name: fct_reviews
    description: Product review fact at review_id grain.

    columns:
      - name: review_id
        data_tests:
          - not_null
          - unique

      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: review_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: rating
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false

      - name: is_low_rating
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

  - name: fct_shipments
    description: Shipment fact at order grain with fulfillment lead times.

    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id

      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: zip
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: zip

      - name: ship_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: delivery_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: shipping_fee
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: days_to_ship
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: days_in_transit
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

  - name: fct_inventory
    description: Monthly inventory snapshot fact at product and snapshot date grain.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - snapshot_date
              - product_id

    columns:
      - name: snapshot_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

      - name: stock_on_hand
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: stockout_flag
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

      - name: stock_value_at_cost
        data_tests:
          - not_null

  - name: fct_web_traffic
    description: Daily website traffic fact with the dominant traffic source.

    columns:
      - name: traffic_date
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: traffic_source
        data_tests:
          - not_null

      - name: sessions
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: bounce_rate
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "BETWEEN 0 AND 1"
