version: 2

models:
  - name: fct_order_items
    description: Transaction fact at order-item grain.

    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

      - name: order_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: quantity
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"

      - name: line_revenue
        data_tests:
          - not_null

      - name: line_cost
        data_tests:
          - not_null

      - name: line_gross_profit
        data_tests:
          - not_null

      - name: has_promo
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

  - name: fct_daily_sales
    description: Daily revenue, cost and profitability fact.

    columns:
      - name: sales_date
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: revenue
        data_tests:
          - not_null

      - name: cogs
        data_tests:
          - not_null

      - name: gross_profit
        data_tests:
          - not_null

  - name: fct_orders
    description: Order-level transaction fact enriched with payment information.

    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: order_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: zip
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: zip

      - name: order_status
        data_tests:
          - not_null

      - name: payment_value
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: installments
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"